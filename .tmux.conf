###############################################################
# --> GENERAL
###############################################################

# fixes vim mode switching delay
set -sg escape-time 0

# render italics as [embark theme] green with no slanted text)
# i don't want italics in my terminal anyway, and this grants some flexibility
set -as terminal-overrides ',xterm-256color:sitm=\E[32m'


###############################################################
# --> PLUGIN CONFIG
###############################################################

# for vim
set -g @resurrect-strategy-vim 'session'


###############################################################
# --> KEYBINDINGS
###############################################################

# credit: https://www.hamvocke.com/blog/a-guide-to-customizing-your-tmux-conf/
# switch panes using Alt-arrow without prefix
#bind -n M-Left select-pane -L
#bind -n M-Right select-pane -R
#bind -n M-Up select-pane -U
#bind -n M-Down select-pane -D

# kill all panes except 0
bind k kill-pane -a -t 0

# easy config reload
bind r source-file ~/.tmux.conf \; display "[!] .tmux.conf reloaded"

# all panes --> horizontal splits spaced evenly 
bind | select-layout even-horizontal

# smart pane switching with awareness of vim splits.
# see https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"
bind-key -n M-Left if-shell "$is_vim" 'send-keys M-Left'  'select-pane -L'
bind-key -n M-Down if-shell "$is_vim" 'send-keys M-Down'  'select-pane -D'
bind-key -n M-Up if-shell "$is_vim" 'send-keys M-Up'  'select-pane -U'
bind-key -n M-Right if-shell "$is_vim" 'send-keys M-Right'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi M-Left select-pane -L
bind-key -T copy-mode-vi M-Down select-pane -D
bind-key -T copy-mode-vi M-Up select-pane -U
bind-key -T copy-mode-vi M-Right select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l


################################################################
# --> STATUS BAR
################################################################

##### GENERAL #####
set -g status-interval 5

# default background color
set-option -g status-style bg=colour8,fg=colour7 # bg=bg1, fg=fg1


##### CENTER #####

# active window 
set-window-option -g automatic-rename on
set-option -g set-titles on

setw -g window-status-format '#I:#W#F'
setw -g window-status-current-format '#[bg=colour8,fg=colour5]#[bg=colour5,fg=colour16] #I:#W#F #[bg=colour8,fg=colour5]'

#setw -g window-status-format "#[bg=blue]#I:#W:#{?window_linked,+#{window_flags},#{window_flags} }#[bg=default]"
#setw -g window-status-current-format "#[fg=black,bg=green]#I:#P:#W:#{?window_linked,+#{window_flags},#{window_flags}}"

set-window-option -g window-status-current-style bg=colour5
set -g window-status-separator " "
set -g status-justify centre


##### LEFT #####
set -g status-left-length 150

# CPU
set -g @cpu_low_bg_color '#[bg=colour2]'
set -g @cpu_medium_bg_color '#[bg=colour3]'
set -g @cpu_high_bg_color '#[bg=colour1]'
set -g @cpu_low_fg_color '#[fg=colour2]'
set -g @cpu_medium_fg_color '#[fg=colour3]'
set -g @cpu_high_fg_color '#[fg=colour1]'
set -g @cpu_percentage_format '%d%%'

# RAM
set -g @ram_low_bg_color '#[bg=colour2]'
set -g @ram_medium_bg_color '#[bg=colour3]'
set -g @ram_high_bg_color '#[bg=colour1]'
set -g @ram_low_fg_color '#[fg=colour2]'
set -g @ram_medium_fg_color '#[fg=colour3]'
set -g @ram_high_fg_color '#[fg=colour1]'
set -g @ram_percentage_format '%d%%'

# BATTERY
set -g @batt_color_charge_primary_tier8 colour10
set -g @batt_color_charge_primary_tier7 colour10
set -g @batt_color_charge_primary_tier6 colour10
set -g @batt_color_charge_primary_tier5 colour10
set -g @batt_color_charge_primary_tier4 colour11
set -g @batt_color_charge_primary_tier3 colour11
set -g @batt_color_charge_primary_tier2 colour1
set -g @batt_color_charge_primary_tier1 colour9
# make fg match bg for the separator
set -g @batt_color_charge_secondary_tier8 colour10
set -g @batt_color_charge_secondary_tier7 colour10
set -g @batt_color_charge_secondary_tier6 colour10
set -g @batt_color_charge_secondary_tier5 colour10
set -g @batt_color_charge_secondary_tier4 colour11
set -g @batt_color_charge_secondary_tier3 colour11
set -g @batt_color_charge_secondary_tier2 colour1
set -g @batt_color_charge_secondary_tier1 colour9

#set -g status-left '\
#{battery_color_charge_bg}#[fg=colour16] #{battery_icon_status} #{battery_percentage} \
#{battery_color_charge_fg} #{cpu_bg_color} \
#{cpu_bg_color}#[fg=colour16]CPU #{cpu_icon} #{cpu_percentage} \
#[bg=colour8]#{cpu_fg_color} '

set -g status-left '\
#{cpu_bg_color}#[fg=colour16] CPU #{cpu_icon} #{cpu_percentage} \
#[bg=colour8]#{cpu_fg_color}#{ram_bg_color} \
#{ram_bg_color}#[fg=colour16]RAM #{ram_icon} #{ram_percentage} \
#[bg=colour8]#{ram_fg_color}'

##### RIGHT #####
set -g status-right-length 200

set-option -g status-right '\
#[fg=colour2]\
#[fg=colour16, bg=colour2] #{spotify_info} \
#[fg=colour5]\
#[fg=colour16, bg=colour5] #{tmux-weather} \
#[fg=colour8]\
#[fg=colour7, bg=colour8] %b %d %H:%M \
#[fg=colour248, bg=colour239]'


